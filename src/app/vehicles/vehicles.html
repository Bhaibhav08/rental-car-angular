<h2>Available Vehicles</h2>

<div class="vehicle-grid">
  <div class="vehicle-card" *ngFor="let car of vehicles">

    

    <div class="details">
      <h3>{{ car.name }}</h3>
      <p class="type">{{ car.type }}</p>

      <p><strong>₹{{ car.price }}</strong> / day</p>
<p>{{ car.kmPerDay }} km / day</p>
      <span 
        class="status"
        [class.available]="car.available"
        [class.unavailable]="!car.available">
        {{ car.available ? 'Available' : 'Booked' }}
      </span>

      
      <button
  [disabled]="!car.available"
  (click)="onBook(car)">
  Book Now
</button>

    </div>

  </div>
</div>
